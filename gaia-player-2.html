<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dear World, Save Our Trees | Green Gaia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --forest: #0a2418;      /* Deep Forest */
    --gold: #d4a94e;        /* Sacred Gold */
    --glow: #3dffa2;        /* Bioluminescent Green */
    --text: #e9f3ec;
    --pulse: 0;             /* 0 to 1, set by JS from the music */
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--forest); }
  body { font-family: "Lato", system-ui, sans-serif; color: var(--text); overflow: hidden; }

  /* ---------- Stage: a tall 9:16 frame, centered on wide screens ---------- */
  .stage {
    position: relative; margin: 0 auto;
    height: 100vh; height: 100dvh;
    width: min(100vw, calc(100dvh * 9 / 16));
    overflow: hidden; background: #000; container-type: inline-size;
  }
  @media (min-aspect-ratio: 9/16) {
    .stage { -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 9%, #000 91%, transparent 100%);
                     mask-image: linear-gradient(90deg, transparent 0, #000 9%, #000 91%, transparent 100%); }
  }
  .stage video {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    opacity: 0; transition: opacity 1.2s ease;
    transform: scale(calc(1 + var(--pulse) * 0.018));
    filter: brightness(calc(1 + var(--pulse) * 0.22)) saturate(calc(1 + var(--pulse) * 0.25));
  }
  .stage video.on { opacity: 1; }

  /* Green glow behind the globe that breathes with the beat */
  .glow {
    position: absolute; left: 50%; top: 34%; width: 118%; aspect-ratio: 1;
    transform: translate(-50%, -50%) scale(calc(0.92 + var(--pulse) * 0.16));
    border-radius: 50%; pointer-events: none; mix-blend-mode: screen;
    background: radial-gradient(circle, rgba(61,255,162, calc(0.04 + var(--pulse) * 0.34)) 0%, rgba(61,255,162,0) 62%);
  }
  .shade { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(5,18,12,.45) 0%, rgba(5,18,12,0) 20%, rgba(5,18,12,0) 52%, rgba(5,18,12,.88) 100%); }

  /* ---------- Text + controls ---------- */
  .top { position: absolute; top: 0; left: 0; right: 0; padding: calc(18px + env(safe-area-inset-top, 0px)) 20px 0; text-align: center; }
  h1 { font-family: "Cinzel", serif; font-weight: 700; margin: 0; color: var(--gold);
       white-space: nowrap;                    /* always one line */
       font-size: min(3.9vw, 2.2dvh);          /* fallback for older browsers */
       font-size: 3.9cqw;                      /* scales with the width of the frame */
       letter-spacing: .04em; text-shadow: 0 2px 14px rgba(0,0,0,.7); }
  .bottom { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center;
            gap: 14px; padding: 0 22px calc(22px + env(safe-area-inset-bottom, 0px)); }

  .versions { display: flex; border: 1px solid rgba(212,169,78,.6); border-radius: 999px; padding: 4px; gap: 4px; background: rgba(5,18,12,.45); }
  .versions button { font: 700 .92rem "Lato", sans-serif; color: var(--text); background: transparent; border: 0;
    border-radius: 999px; padding: 9px 20px; cursor: pointer; transition: background .2s, color .2s; }
  .versions button[aria-pressed="true"] { background: var(--gold); color: var(--forest); }

  #play { font: 700 1.05rem "Cinzel", serif; letter-spacing: .06em; color: var(--forest); background: var(--glow);
    border: 0; border-radius: 999px; padding: 13px 44px; cursor: pointer;
    box-shadow: 0 0 calc(10px + var(--pulse) * 34px) rgba(61,255,162,.6); }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

  .scrub { width: 100%; display: flex; align-items: center; gap: 12px; font-size: .82rem; }
  .scrub input[type=range] { flex: 1; accent-color: var(--glow); }
  .note { font-size: .78rem; opacity: .75; min-height: 1.1em; text-align: center; }

  @media (prefers-reduced-motion: reduce) {
    .stage video { transform: none; filter: none; transition: none; }
    .glow { transform: translate(-50%, -50%); }
  }
</style>
</head>
<body>

<main class="stage" id="stage">
  <video id="vA" muted playsinline preload="auto" poster="hero-poster.jpg"></video>
  <video id="vB" muted playsinline preload="auto"></video>
  <div class="glow" aria-hidden="true"></div>
  <div class="shade" aria-hidden="true"></div>

  <div class="top"><h1>Dear World, Save Our Trees</h1></div>

  <div class="bottom">
    <div class="versions" role="group" aria-label="Choose a version">
      <button type="button" data-i="0" aria-pressed="true">Version 1</button>
      <button type="button" data-i="1" aria-pressed="false">Version 2</button>
    </div>
    <button type="button" id="play">Play</button>
    <div class="scrub">
      <span id="cur">0:00</span>
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek">
      <span id="dur">0:00</span>
    </div>
    <div class="note" id="note"></div>
  </div>
</main>

<audio id="audio" preload="metadata" crossorigin="anonymous"></audio>

<script>
/* ===================== SETTINGS YOU MAY EDIT ===================== */
const TRACKS = [
  { src: "dear-world-v1.mp3", bpm: 136 },
  { src: "dear-world-v2.mp3", bpm: 129 }
];
// Clips play in this order, then loop. Rename or reorder freely.
const CLIPS = ["hero-1.mp4", "hero-2.mp4", "hero-3.mp4", "hero-4.mp4"];
const FADE_SECONDS = 1.2;   // crossfade length between clips
/* ================================================================= */

const $ = id => document.getElementById(id);
const audio = $("audio"), stage = $("stage"), playBtn = $("play"),
      seek = $("seek"), cur = $("cur"), dur = $("dur"), note = $("note");
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- Hero video: two layers that crossfade through the clips ---------- */
const layers = [$("vA"), $("vB")];
let front = 0, clipIndex = 0, fading = false;

function startClip(layer, i) {
  layer.src = CLIPS[i];
  layer.currentTime = 0;
  const p = layer.play(); if (p && p.catch) p.catch(() => {});
}
function crossfade() {
  if (fading) return; fading = true;
  clipIndex = (clipIndex + 1) % CLIPS.length;
  const back = 1 - front;
  startClip(layers[back], clipIndex);
  layers[back].classList.add("on");
  layers[front].classList.remove("on");
  const old = front; front = back;
  setTimeout(() => { layers[old].pause(); fading = false; }, FADE_SECONDS * 1000 + 100);
}
layers.forEach((v, idx) => v.addEventListener("timeupdate", () => {
  if (idx !== front || !v.duration || reduceMotion) return;
  if (v.duration - v.currentTime < FADE_SECONDS) crossfade();
}));
layers.forEach(v => v.addEventListener("ended", () => { if (!fading) crossfade(); }));

if (reduceMotion) {            // calm mode: one still frame, no motion
  layers[0].classList.add("on"); layers[0].src = CLIPS[0];
} else {
  startClip(layers[0], 0); layers[0].classList.add("on");
}
// Some phones pause background video when the tab is hidden; resume on return.
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && !reduceMotion) { const p = layers[front].play(); if (p && p.catch) p.catch(() => {}); }
});

/* ---------- Songs ---------- */
let current = 0;
function loadTrack(i, keepPlaying) {
  current = i;
  document.querySelectorAll(".versions button").forEach(b =>
    b.setAttribute("aria-pressed", String(+b.dataset.i === i)));
  audio.src = TRACKS[i].src; audio.load();
  if (keepPlaying) audio.play().catch(() => {});
}
document.querySelectorAll(".versions button").forEach(b =>
  b.addEventListener("click", () => loadTrack(+b.dataset.i, !audio.paused)));

/* ---------- Beat detection (falls back to a steady pulse at the track's tempo) ---------- */
let ctx, analyser, freq, wired = false, silentFrames = 0, useFallback = false;
function wireAudio() {
  if (wired) return; wired = true;
  try {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = ctx.createMediaElementSource(audio);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 512; analyser.smoothingTimeConstant = 0.55;
    src.connect(analyser); analyser.connect(ctx.destination);
    freq = new Uint8Array(analyser.frequencyBinCount);
  } catch (e) { useFallback = true; }
}
let pulse = 0, avg = 0;
function readPulse() {
  if (audio.paused) return pulse * 0.9;
  if (!useFallback && analyser) {
    analyser.getByteFrequencyData(freq);
    let bass = 0; for (let i = 1; i < 7; i++) bass += freq[i];
    bass /= 6 * 255;
    if (bass < 0.001) { if (++silentFrames > 90) useFallback = true; } else silentFrames = 0;
    avg = avg * 0.96 + bass * 0.04;
    const hit = Math.max(0, bass - avg * 0.9) * 3.2;
    return Math.min(1, Math.max(pulse * 0.82, hit));
  }
  const beat = 60 / TRACKS[current].bpm;
  return Math.pow(1 - ((audio.currentTime % beat) / beat), 3);
}
function frame() {
  pulse = reduceMotion ? 0 : readPulse();
  stage.style.setProperty("--pulse", pulse.toFixed(3));
  document.documentElement.style.setProperty("--pulse", pulse.toFixed(3));
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- Transport ---------- */
const fmt = s => isFinite(s) ? `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}` : "0:00";
playBtn.addEventListener("click", async () => {
  wireAudio();
  if (ctx && ctx.state === "suspended") await ctx.resume();
  if (audio.paused) { await audio.play().catch(() => { note.textContent = "Tap Play again to start the music."; }); }
  else audio.pause();
});
audio.addEventListener("play",  () => { playBtn.textContent = "Pause"; note.textContent = ""; });
audio.addEventListener("pause", () => { playBtn.textContent = "Play"; });
audio.addEventListener("ended", () => { playBtn.textContent = "Play"; });
audio.addEventListener("loadedmetadata", () => { dur.textContent = fmt(audio.duration); });
audio.addEventListener("timeupdate", () => {
  cur.textContent = fmt(audio.currentTime);
  if (audio.duration) seek.value = (audio.currentTime / audio.duration) * 1000;
});
seek.addEventListener("input", () => { if (audio.duration) audio.currentTime = (seek.value / 1000) * audio.duration; });

loadTrack(0, false);
</script>
</body>
</html>
